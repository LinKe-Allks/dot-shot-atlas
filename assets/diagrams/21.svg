<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#BF6948"/></marker><filter id="blur"><feGaussianBlur stdDeviation="5"/></filter><clipPath id="main"><rect x="48" y="144" width="864" height="346" rx="12"/></clipPath></defs><rect x="0" y="0" width="960" height="600" rx="0" fill="#F4EFE4"/><text x="48" y="42" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#BF6948" font-weight="600" text-anchor="start">FRAME STUDIES / AI VIDEO</text><text x="912" y="42" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#BF6948" font-weight="600" text-anchor="end">21 / 24</text><text x="48" y="87" font-family="DejaVu Sans,sans-serif" font-size="34" fill="#173D3B" font-weight="700" text-anchor="start">Dolly zoom</text><text x="48" y="118" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#74938A" font-weight="400" text-anchor="start">Move backward and zoom in to preserve subject size.</text><rect x="48" y="144" width="410" height="264" rx="10" fill="#DCE4D8"/><text x="62" y="172" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#173D3B" font-weight="600" text-anchor="start">START: WIDE LENS</text><path d="M100,190 L200,380 L340,380 L410,190" fill="none" stroke="#74938A" stroke-width="8" /><g transform="translate(253,284) scale(1)"><circle cx="0" cy="-72" r="17" fill="#173D3B"/><path d="M-24,-43 Q0,-57 24,-43 L32,12 L14,12 L12,68 L-3,68 L-6,14 L-11,68 L-26,68 L-22,8 L-34,8 Z" fill="#173D3B" stroke="#173D3B" stroke-width="1" /></g><rect x="502" y="144" width="410" height="264" rx="10" fill="#DCE4D8"/><text x="516" y="172" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#173D3B" font-weight="600" text-anchor="start">END: LONGER LENS</text><path d="M530,170 L580,390 M885,170 L840,390" fill="none" stroke="#74938A" stroke-width="16" /><g transform="translate(707,284) scale(1)"><circle cx="0" cy="-72" r="17" fill="#173D3B"/><path d="M-24,-43 Q0,-57 24,-43 L32,12 L14,12 L12,68 L-3,68 L-6,14 L-11,68 L-26,68 L-22,8 L-34,8 Z" fill="#173D3B" stroke="#173D3B" stroke-width="1" /></g><text x="480" y="449" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#BF6948" font-weight="600" text-anchor="middle">DOLLY BACK  +  ZOOM IN</text><text x="480" y="480" font-family="DejaVu Sans,sans-serif" font-size="14" fill="#173D3B" font-weight="600" text-anchor="middle">SAME SUBJECT SIZE / CHANGING BACKGROUND SCALE</text><path d="M48,522 L912,522" fill="none" stroke="#74938A" stroke-width="1" stroke-dasharray=""/><text x="48" y="554" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#173D3B" font-weight="400" text-anchor="start">Coordinate both changes; a zoom alone is not a dolly zoom.</text><text x="912" y="583" font-family="DejaVu Sans,sans-serif" font-size="10" fill="#74938A" font-weight="400" text-anchor="end">ORIGINAL DIAGRAM</text></svg>